version: "3.7"
services:
  dbatools1:
    container_name: "dbatools1"
    image: dbatools/sqlinstance
    ports:
      - "1401:1433"
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/workspace:cached
  dbatools2:
    depends_on:
      - dbatools1
    container_name: "dbatools2"
    image: dbatools/sqlinstance
    ports:
      - "1402:1433"
  dbatools3:
    depends_on:
      - dbatools1
    container_name: "dbatools3"
    image: dbatools/sqlinstance
    ports:
      - "1403:1433"
